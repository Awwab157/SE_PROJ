# Similarity weights and retrieval limits (FR-1.4, TBD-2). Tune on fixtures; weights should sum to 1.0.

video_weights:
  text_cosine: 0.55         # TF-IDF cosine over title + description + tags
  shared_tags: 0.15         # Jaccard overlap of lower-cased tags
  same_category: 0.10
  same_channel: 0.05
  duration_closeness: 0.10  # 1 - |a - b| / max(a, b); 0 when either duration is unknown
  language_match: 0.05

channel:
  # Secondary signals only break ties at the reported precision of content similarity:
  # they can never move a channel above one with higher content similarity (FR-2).
  content_precision: 3
  secondary_weights:
    subscriber_closeness: 0.4
    upload_cadence: 0.3
    language_match: 0.3

limits:
  default_limit: 10
  max_limit: 50

retrieval:
  similar_videos:
    max_search_queries: 3
    results_per_search: 25
    seed_channel_uploads: 25
    max_candidates: 100
    query_terms: 4
  similar_channels:
    max_search_queries: 2
    results_per_search: 25
    seed_uploads: 15
    candidate_uploads: 10
    max_candidate_profiles: 15
  recommendations:
    max_likes: 1000
    max_subscriptions: 200
    max_playlists: 10
    max_items_per_playlist: 100
    max_search_queries: 3
    results_per_search: 25
    subscribed_channels_sampled: 2
    uploads_per_channel: 10
  engagement:
    max_likes: 1000
    max_subscriptions: 1000
    max_playlists: 20
    max_items_per_playlist: 200
    category_region: US
  playlist:
    search_pages: 3
    results_per_page: 50
    max_items: 50
    fill_target: 0.9
    duration_quantum_seconds: 5
