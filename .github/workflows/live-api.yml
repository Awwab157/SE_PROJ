name: live-api

# Calls the real YouTube Data API with a fixed quota budget (TQ-5). Never runs on pull requests.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-api
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    environment: live-api
    env:
      YT_INTEL_LIVE_TOKEN_JSON: ${{ secrets.YT_INTEL_LIVE_TOKEN_JSON }}
      YT_INTEL_LIVE_VIDEO: ${{ secrets.YT_INTEL_LIVE_VIDEO }}
      YT_INTEL_LIVE_CHANNEL: ${{ secrets.YT_INTEL_LIVE_CHANNEL }}
      YT_INTEL_LOCAL_APPROVAL: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Live tests (read-only, budget capped in tests/live)
        run: python -m pytest -o addopts="" -m live -q tests/live
