[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-intel-mcp"
version = "1.0.0"
description = "YouTube Video Intelligence MCP server (stdio transport, YouTube Data API v3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.2",
    "keyring>=24",
    "cryptography>=41",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
    "anyio>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
yt-intel-mcp = "yt_intel_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' -p no:cacheprovider"
markers = [
    "live: calls the real YouTube Data API; runs only in .github/workflows/live-api.yml",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
